name=Hublink-Node-Raven
version=0.2.0
author=Matt Gaidica <gaidica@wustl.edu>
maintainer=Matt Gaidica <gaidica@wustl.edu>
sentence=Hardware API for Hublink Node Raven ESP32-S3: sensors, SD, CSV logging, and meta tools.
paragraph=Provides a fixed pin map and services for DS3231 (RTC), MAX17048 (fuel gauge), VEML7700 light, BME680 environment, SD over SPI, and ULP-assisted magnet pulse counting on deep sleep. Includes DataLoggerHelper for masked CSV rows, MetaConfigEditor (USB serial meta.json and SD file shell with optional live sensor snapshots), millis-based safeguard: bool automatic or manual isCellBelowTripVoltage + safeguardShutdown; DataLoggerHelper runs automatic after I2C, and LoggerWorkflow helpers. The HubWheelHublink example additionally requires the separate Hublink library. Target board: ESP32-S3 variants used by Hublink Node v2 hardware.
category=Device Control
url=https://github.com/Neurotech-Hub/Hublink-Node-Raven
architectures=esp32
includes=HublinkNodeRaven.h
depends=RTClib,Adafruit MAX1704X,Adafruit BusIO,Adafruit VEML7700 Library,Adafruit BME680 Library,ArduinoJson
